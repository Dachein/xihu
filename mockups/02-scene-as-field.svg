<?xml version="1.0" encoding="UTF-8"?>
<!--
  西湖 · 山水底盘 · v0 头画 #2
  目的：演示「景 = 域 + 视点 + 视线 + 条件」该怎么画在底盘上
  在第一张稿基础上叠加 3 个范例景：
    · 断桥残雪 (局部场域 + 天气)
    · 雷峰夕照 (视线主导)
    · 三潭印月 (水上场域 + 月夜)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500"
     style="background:#f5f1e8" font-family="'Noto Serif SC','Songti SC',STSong,serif">
  <defs>
    <filter id="paper" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.95   0 0 0 0 0.92   0 0 0 0 0.86   0 0 0 0.06 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="washSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="fieldBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#c8bfb1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a39a8b" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#7a7268" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4a443d" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#3a342d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1c1916" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="lake" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0%"  stop-color="#eae6dc"/>
      <stop offset="60%" stop-color="#d4cfc2"/>
      <stop offset="100%" stop-color="#b5af9f"/>
    </radialGradient>
    <pattern id="ripple" x="0" y="0" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10 Q 10 6, 20 10 T 40 10" stroke="#9c9685" stroke-width="0.4" fill="none" opacity="0.35"/>
    </pattern>

    <!-- 域的发光：冷调（雪/月） -->
    <radialGradient id="fieldCool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#e8ebf0" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#cdd2da" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#cdd2da" stop-opacity="0"/>
    </radialGradient>
    <!-- 域的发光：暖调（夕光/钟声） -->
    <radialGradient id="fieldWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#f0d8a8" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#d8a868" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#d8a868" stop-opacity="0"/>
    </radialGradient>
    <!-- 视轴渐变：从视点出发，强→弱 -->
    <linearGradient id="axisFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#1c1916" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1c1916" stop-opacity="0"/>
    </linearGradient>

    <!-- 视点标记（三角朝向） -->
    <marker id="vpArrow" viewBox="0 0 10 10" refX="6" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L8 5 L0 10 Z" fill="#1c1916"/>
    </marker>
  </defs>

  <rect width="1200" height="1500" fill="#f5f1e8"/>
  <rect width="1200" height="1500" filter="url(#paper)"/>

  <!-- 标题 -->
  <g transform="translate(80,120)">
    <text font-size="84" fill="#1c1916" letter-spacing="8">西湖</text>
    <text y="40" font-size="11" fill="#7a7268" letter-spacing="6"
          font-family="ui-sans-serif,system-ui">XIHU · 景 = 域 + 视点 + 视线 + 条件</text>
    <line x1="0" y1="60" x2="60" y2="60" stroke="#1c1916" stroke-width="1"/>
    <text y="92" font-size="13" fill="#4a443d" font-style="italic">
      景活在 viewer 与 object 之间
    </text>
  </g>
  <text x="1120" y="120" font-size="11" fill="#7a7268" letter-spacing="3"
        text-anchor="end" font-family="ui-sans-serif,system-ui">v0 · scene as field</text>
  <text x="1120" y="138" font-size="10" fill="#a39a8b" letter-spacing="2"
        text-anchor="end" font-family="ui-sans-serif,system-ui">2026.05.10</text>

  <!-- ============== 山水主图 ============== -->
  <g transform="translate(0,180)">

    <!-- 远山 -->
    <g filter="url(#washSoft)">
      <path d="M 80 480 Q 220 280, 340 360 Q 420 280, 540 380
               Q 600 340, 660 400 L 660 600 L 80 600 Z" fill="url(#hillFar)"/>
    </g>
    <!-- 中景山 -->
    <g filter="url(#wash)">
      <path d="M 380 540 Q 480 460, 560 510 Q 620 480, 700 530
               Q 780 510, 860 540 L 860 620 L 380 620 Z" fill="url(#hillMid)"/>
      <path d="M 240 990 Q 360 920, 460 960 Q 560 900, 660 950
               Q 780 920, 900 970 L 900 1080 L 240 1080 Z" fill="url(#hillMid)"/>
    </g>
    <!-- 近景山 -->
    <g filter="url(#wash)">
      <path d="M 0 1140 Q 200 1080, 400 1100 Q 600 1060, 820 1090
               Q 1000 1080, 1200 1100 L 1200 1200 L 0 1200 Z" fill="url(#hillNear)"/>
    </g>

    <!-- 湖面 -->
    <path d="M 360 620 Q 320 700, 330 820 Q 340 940, 410 990
             Q 540 1010, 660 990 Q 780 970, 830 880
             Q 860 760, 820 660 Q 720 620, 600 615
             Q 480 615, 360 620 Z" fill="url(#lake)"/>
    <path d="M 360 620 Q 320 700, 330 820 Q 340 940, 410 990
             Q 540 1010, 660 990 Q 780 970, 830 880
             Q 860 760, 820 660 Q 720 620, 600 615
             Q 480 615, 360 620 Z" fill="url(#ripple)" opacity="0.6"/>

    <!-- ============== 景 1：断桥残雪 ============== -->
    <!-- 域：白堤东端 + 断桥 + 北里湖一小片冷光 -->
    <g filter="url(#fieldBlur)">
      <ellipse cx="610" cy="640" rx="95" ry="42" fill="url(#fieldCool)"/>
    </g>
    <!-- 域边界（虚线，可选） -->
    <ellipse cx="610" cy="640" rx="95" ry="42" fill="none"
             stroke="#7a8590" stroke-width="0.4" stroke-dasharray="3,4" opacity="0.5"/>
    <!-- 视点：站在断桥南端，朝西看 -->
    <g transform="translate(600,615) rotate(190)">
      <path d="M0 -7 L5 5 L-5 5 Z" fill="#1c1916"/>
    </g>
    <!-- 视轴：朝西的虚线 -->
    <line x1="600" y1="615" x2="540" y2="630" stroke="url(#axisFade)"
          stroke-width="1" stroke-dasharray="3,3"/>
    <!-- 标注 -->
    <text x="700" y="640" font-size="14" fill="#1c1916" letter-spacing="2">断桥残雪</text>
    <text x="700" y="656" font-size="9" fill="#4a443d" letter-spacing="2"
          font-family="ui-sans-serif,system-ui">SNOW · DAWN · WINTER</text>
    <text x="700" y="670" font-size="9" fill="#7a7268" letter-spacing="1.5"
          font-family="ui-sans-serif,system-ui">域：白堤东端 + 断桥 + 北里湖</text>

    <!-- ============== 景 2：雷峰夕照 ============== -->
    <!-- 域：夕照山 + 西侧湖面金光走廊（楔形） -->
    <g filter="url(#fieldBlur)">
      <path d="M 700 950 L 440 800 L 420 880 L 700 980 Z" fill="url(#fieldWarm)"/>
    </g>
    <!-- 域边界 -->
    <path d="M 700 950 L 440 800 L 420 880 L 700 980 Z"
          fill="none" stroke="#a8804a" stroke-width="0.4" stroke-dasharray="3,4" opacity="0.5"/>
    <!-- 视点：苏堤上一处，朝西看 -->
    <g transform="translate(430,840) rotate(95)">
      <path d="M0 -7 L5 5 L-5 5 Z" fill="#1c1916"/>
    </g>
    <text x="395" y="845" font-size="9" fill="#4a443d" text-anchor="end"
          font-family="ui-sans-serif,system-ui" letter-spacing="1">视点 · 苏堤压堤桥</text>
    <!-- 视轴：从视点直指雷峰塔 -->
    <line x1="430" y1="840" x2="700" y2="945" stroke="url(#axisFade)"
          stroke-width="1.4" stroke-dasharray="0"/>
    <!-- 标注 -->
    <text x="700" y="1010" font-size="14" fill="#1c1916" letter-spacing="2">雷峰夕照</text>
    <text x="700" y="1026" font-size="9" fill="#4a443d" letter-spacing="2"
          font-family="ui-sans-serif,system-ui">SUNSET · CLEAR · WEST GAZE</text>
    <text x="700" y="1040" font-size="9" fill="#7a7268" letter-spacing="1.5"
          font-family="ui-sans-serif,system-ui">域：夕照山 + 西侧湖面金光走廊</text>

    <!-- ============== 景 3：三潭印月 ============== -->
    <!-- 域：南湖水面，月光铺陈 -->
    <g filter="url(#fieldBlur)">
      <ellipse cx="635" cy="918" rx="60" ry="48" fill="url(#fieldCool)" opacity="0.8"/>
    </g>
    <ellipse cx="635" cy="918" rx="60" ry="48" fill="none"
             stroke="#7a8590" stroke-width="0.4" stroke-dasharray="3,4" opacity="0.4"/>
    <!-- 视点：从船上仰观（船标） -->
    <g transform="translate(685,905)">
      <path d="M-6 0 Q 0 4 6 0 L 4 -2 L -4 -2 Z" fill="#1c1916"/>
      <line x1="0" y1="-2" x2="0" y2="-7" stroke="#1c1916" stroke-width="0.6"/>
    </g>
    <text x="700" y="900" font-size="9" fill="#4a443d"
          font-family="ui-sans-serif,system-ui" letter-spacing="1">视点 · 游船</text>
    <!-- 视轴：船朝塔群 -->
    <line x1="680" y1="905" x2="640" y2="918" stroke="url(#axisFade)"
          stroke-width="0.8" stroke-dasharray="2,3"/>
    <!-- 三塔 -->
    <g fill="#1c1916">
      <circle cx="620" cy="900" r="2.5"/>
      <circle cx="650" cy="918" r="2.5"/>
      <circle cx="635" cy="935" r="2.5"/>
    </g>
    <text x="500" y="965" font-size="14" fill="#1c1916" letter-spacing="2">三潭印月</text>
    <text x="500" y="981" font-size="9" fill="#4a443d" letter-spacing="2"
          font-family="ui-sans-serif,system-ui">MID-AUTUMN · MOON · WATER</text>
    <text x="500" y="995" font-size="9" fill="#7a7268" letter-spacing="1.5"
          font-family="ui-sans-serif,system-ui">域：南湖水面，月光铺陈</text>

    <!-- 苏堤白堤底层骨架（保留） -->
    <path d="M 410 990 Q 420 800, 440 660" stroke="#3a342d"
          stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M 600 615 Q 660 625, 720 640" stroke="#3a342d"
          stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <!-- 印章 -->
    <g transform="translate(1080,1140)">
      <rect x="-26" y="-26" width="52" height="52" fill="none" stroke="#8a3a2a" stroke-width="2"/>
      <text font-size="12" fill="#8a3a2a" text-anchor="middle" y="-6" letter-spacing="1">西湖</text>
      <text font-size="10" fill="#8a3a2a" text-anchor="middle" y="12"
            letter-spacing="1" font-family="ui-sans-serif,system-ui">V0</text>
    </g>
  </g>

  <!-- ============== 图例：景的解剖 ============== -->
  <g transform="translate(80,1300)">
    <text font-size="13" fill="#1c1916" letter-spacing="2">景 · 解剖</text>
    <line x1="0" y1="14" x2="40" y2="14" stroke="#1c1916" stroke-width="0.6"/>

    <g transform="translate(0,40)" font-family="ui-sans-serif,system-ui">
      <!-- 域 sample -->
      <ellipse cx="22" cy="0" rx="22" ry="10" fill="url(#fieldCool)" filter="url(#fieldBlur)"/>
      <ellipse cx="22" cy="0" rx="22" ry="10" fill="none"
               stroke="#7a8590" stroke-width="0.4" stroke-dasharray="3,4" opacity="0.5"/>
      <text x="60" y="0" font-size="11" fill="#1c1916" dominant-baseline="middle"
            font-family="'Noto Serif SC',serif">域</text>
      <text x="80" y="0" font-size="9" fill="#7a7268" dominant-baseline="middle"
            letter-spacing="1.5">field — 你"进入"的范围</text>
    </g>

    <g transform="translate(0,72)" font-family="ui-sans-serif,system-ui">
      <g transform="translate(22,0) rotate(90)">
        <path d="M0 -7 L5 5 L-5 5 Z" fill="#1c1916"/>
      </g>
      <text x="60" y="0" font-size="11" fill="#1c1916" dominant-baseline="middle"
            font-family="'Noto Serif SC',serif">视点</text>
      <text x="92" y="0" font-size="9" fill="#7a7268" dominant-baseline="middle"
            letter-spacing="1.5">viewpoint — 站在哪儿、朝哪儿</text>
    </g>

    <g transform="translate(0,104)" font-family="ui-sans-serif,system-ui">
      <line x1="0" y1="0" x2="44" y2="0" stroke="url(#axisFade)" stroke-width="1.2"/>
      <text x="60" y="0" font-size="11" fill="#1c1916" dominant-baseline="middle"
            font-family="'Noto Serif SC',serif">视线</text>
      <text x="92" y="0" font-size="9" fill="#7a7268" dominant-baseline="middle"
            letter-spacing="1.5">axis — 视点指向 subject</text>
    </g>

    <g transform="translate(0,136)" font-family="ui-sans-serif,system-ui">
      <text x="0" y="0" font-size="9" fill="#4a443d" letter-spacing="2"
            dominant-baseline="middle">SNOW · DAWN</text>
      <text x="60" y="0" font-size="11" fill="#1c1916" dominant-baseline="middle"
            font-family="'Noto Serif SC',serif">条件</text>
      <text x="92" y="0" font-size="9" fill="#7a7268" dominant-baseline="middle"
            letter-spacing="1.5">medium — 景成立的天-时-感</text>
    </g>
  </g>

  <!-- ============== 底部诗题 ============== -->
  <g transform="translate(80,1450)">
    <text font-size="14" fill="#4a443d" font-style="italic" letter-spacing="2">
      欲把西湖比西子，淡妆浓抹总相宜。
    </text>
  </g>
</svg>
