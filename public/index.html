<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f241e" />
    <title>西湖山水图谱</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <div id="map" aria-label="西湖山水动态地图"></div>

      <header class="topbar">
        <div class="brand">
          <span class="brand-mark"></span>
          <div>
            <p>西湖山水图谱</p>
            <span id="camera-state">山水图</span>
          </div>
        </div>
        <div class="icon-row">
          <button class="icon-button" id="locate-btn" type="button" aria-label="定位并创建观察点">
            <i data-lucide="crosshair"></i>
          </button>
          <button class="icon-button" id="share-view-btn" type="button" aria-label="分享当前山水视角">
            <i data-lucide="share-2"></i>
          </button>
          <button class="icon-button" id="reset-btn" type="button" aria-label="复位视角">
            <i data-lucide="rotate-ccw"></i>
          </button>
        </div>
      </header>

      <section class="modebar" aria-label="地图模式">
        <button class="mode-chip active" data-mode="terrain" type="button">
          <i data-lucide="mountain"></i>
          <span>山水</span>
        </button>
        <button class="mode-chip" data-mode="point" type="button">
          <i data-lucide="map-pin"></i>
          <span>点</span>
        </button>
        <button class="mode-chip" data-mode="route" type="button">
          <i data-lucide="route"></i>
          <span>路</span>
        </button>
      </section>


      <button class="camera-panel-toggle" id="camera-toggle" type="button" aria-expanded="false" aria-controls="camera-controls" aria-label="展开控制盘" title="控制盘">
        <i data-lucide="panel-bottom-open"></i>
        <span>控制盘</span>
      </button>

      <section class="camera-controls hidden" id="camera-controls" aria-label="观察控制">
        <div class="dpad" aria-label="前后左右移动">
          <button class="control-button dpad-up" data-camera-action="forward" type="button" aria-label="前进" title="前进">
            <i data-lucide="arrow-up"></i>
          </button>
          <button class="control-button dpad-left" data-camera-action="left" type="button" aria-label="左移" title="左移">
            <i data-lucide="arrow-left"></i>
          </button>
          <button class="control-button dpad-right" data-camera-action="right" type="button" aria-label="右移" title="右移">
            <i data-lucide="arrow-right"></i>
          </button>
          <button class="control-button dpad-down" data-camera-action="backward" type="button" aria-label="后退" title="后退">
            <i data-lucide="arrow-down"></i>
          </button>
        </div>
        <div class="camera-strip" aria-label="升降旋转俯仰">
          <button class="control-button" data-camera-action="zoom-out" type="button" aria-label="升高视角" title="升高视角">
            <i data-lucide="zoom-out"></i>
          </button>
          <button class="control-button" data-camera-action="zoom-in" type="button" aria-label="降低视角" title="降低视角">
            <i data-lucide="zoom-in"></i>
          </button>
          <button class="control-button" data-camera-action="rotate-left" type="button" aria-label="左转" title="左转">
            <i data-lucide="rotate-ccw"></i>
          </button>
          <button class="control-button" data-camera-action="rotate-right" type="button" aria-label="右转" title="右转">
            <i data-lucide="rotate-cw"></i>
          </button>
          <button class="control-button" data-camera-action="pitch-up" type="button" aria-label="增强俯视" title="增强俯视">
            <i data-lucide="chevrons-up"></i>
          </button>
          <button class="control-button" data-camera-action="pitch-down" type="button" aria-label="降低俯仰" title="降低俯仰">
            <i data-lucide="chevrons-down"></i>
          </button>
        </div>
      </section>

      <section class="sheet" id="sheet" aria-label="地址菜单">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <div>
            <p class="eyebrow">Address</p>
            <h1 id="sheet-title">地址</h1>
          </div>
          <button class="icon-button" id="sheet-toggle" type="button" aria-label="展开或收起">
            <i data-lucide="chevron-up"></i>
          </button>
        </div>

        <div class="search-row">
          <i data-lucide="search"></i>
          <input id="entity-search" type="search" placeholder="搜索点、区、路" autocomplete="off" />
        </div>

        <div class="address-tabs" aria-label="地址类型">
          <button class="address-tab active" data-address-filter="all" type="button">全部</button>
          <button class="address-tab" data-address-filter="point" type="button">点</button>
          <button class="address-tab" data-address-filter="area" type="button">区</button>
          <button class="address-tab" data-address-filter="route" type="button">路</button>
        </div>

        <div class="detail-card" id="detail-card">
          <p class="muted">点地图任意位置，创建一个可回到、可分享的山中观察点。</p>
        </div>

        <div class="entity-list" id="entity-list"></div>
      </section>
    </main>

    <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script>
    <script type="module" src="src/main.js?v=desktop-controls-water-soft-20260611"></script>
  </body>
</html>
